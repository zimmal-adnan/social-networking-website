<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trailblaze - Create Post</title>

    <!--Reference to CSS file-->
    <link rel="stylesheet" href="createPost.css">
    <link rel="stylesheet" href="feed.css">
    <script type="text/javascript" src="createPost.js" defer></script>

    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
    <script src="https://kit.fontawesome.com/4fc40ea9d1.js" crossorigin="anonymous"></script>
</head>
<body>
    <nav>
        <div class = "logo">
            <h4>Trailblaze</h4>
        </div>

        <div class = "nav-links">
            <i class="fa-regular fa-comment-dots"></i>
            <i class="fa-solid fa-house-chimney"></i>
            <i class="fa-regular fa-square-plus"></i>
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-book-open"></i>
        </div>

        <div class = "profile-picture">
            <img src="../Images/profile.jpg" id="profile-picture-image" class="profile-picture-image" alt="Profile Picture">
        </div>
        
    </nav>

    <div class = "create-post-header">
        <h1 class = "header-title">CREATE A MASTERPIECE</h1>
    </div>

    <main>
        <div class = "post-and-caption">
            <div class="post-input">
                <img src="../Images/Space.jpg" class="post-picture" alt="Post Preview" id="preview-image">
                <input id="input-file" type="file" accept="image/jpeg, image/png, image/jpg"> 
                <button class="upload" id="upload" type="button">
                    <i class="fa-solid fa-circle-chevron-up"></i>
                    Upload Picture(s)
                </button>
            </div>

            <div class="caption-input">
                <h2 class = "caption-title">Add Caption...</h2>
                <input class = "add-caption">
                <input class="budget-input" type="text" placeholder="Enter budget">
            </div>
        </div>
        

        <div class="location-input">
            <h2>Add Location</h2>
            <img src="../Images/Space.jpg" alt="Map">

            <div class="location-and-weather">
                <input class="location" type="text" placeholder="Enter location">
                
                <div class="weather-container">
                    <input class="weather" type="text" placeholder="Enter weather">
                </div>
            </div>
        </div>

        <button type="button" class = "post-button">POST</button>
    </main>
</body>
</html>
