<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Trailblaze</title>

        <link rel="stylesheet" href="signup.css">
        <script type = "text/javascript" src = "signup.js" defer></script>

        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css" integrity="sha384-UHRtZLI+pbxtHCWp1t77Bi1L4ZtiqrqD80Kn4Z8NTSRyMA2Fd33n5dQ8lWUE00s/" crossorigin="anonymous">
        <script src="https://kit.fontawesome.com/4fc40ea9d1.js" crossorigin="anonymous"></script>
    </head>
    <body>     
        <div id = "signup" class = "signup">
            <h1>SIGN UP</h1>
            <h2>Signup to join the community</h2>

            <div class = "form-scroll">
            <form class="signup-form">
                <div class="profile-input-field">
                    <img src="../Images/profile.jpg" id="profile-picture" class="profile-picture" alt="Profile Picture">
                    <input id="input-file" type="file" accept="image/jpeg, image/png, image/jpg"> 
                    <button class = "upload" id = "upload" type="button">
                        <i class="fa-solid fa-circle-chevron-up" style = "position: relative; left: -1px;"></i>
                        Upload Profile Picture
                    </button>
                </div>
                <div class="input-field">
                    <input class="input-with-line" type="text" name="username" placeholder="Enter Username...">
                </div>
                <div class="input-field">
                    <input class="input-with-line" type="password" name="password" placeholder="Enter Password...">
                </div>
                <div class="input-field">
                    <input class="input-with-line" type="password" name="confirm-password" placeholder="Confirm Password...">
                </div>
                <div class="input-field">
                    <input class="input-with-line" type="email" name="email" placeholder="Enter Email...">
                </div>
            </form>
            </div>
            <button class = "registration-button">SIGN UP</button>
            <hr style = "position: relative; top: 1.2rem; width: 15rem;">
            <h3>Already Have An Account? <a class = "link-text">LOGIN</a></h3>

        </div>

        <div id = "login" class = "login">
            <h1>LOGIN</h1>
            <h2>Please login with your username and password</h2>
            
            <form class = "login-form">
                <div class="input-field">
                    <input class="input-with-line" type="text" name="username" placeholder="Enter Username...">
                </div>
                <div class="input-field">
                    <input class="input-with-line" type="password" name="password" placeholder="Enter Password...">
                </div>
            </form>

            <button class = "registration-button">LOGIN</button>
            <hr style = "position: relative; top: 1.2rem; width: 15rem;">
            <h3>Don't Have An Account? <a class = "link-text">SIGNUP</a></h3>
        </div>
    </body>
</html>
